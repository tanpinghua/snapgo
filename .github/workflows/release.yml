name: Release

# Push a tag like v0.1.0 to build the .deb and publish a GitHub Release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  deb:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Check the tag matches Cargo.toml
        run: |
          version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match Cargo.toml version $version" >&2
            exit 1
          fi
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y libgtk-4-dev fonts-dejavu-core
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --locked
      - name: Build the Debian package
        run: |
          cargo install cargo-deb --locked
          cargo deb --locked
      - uses: softprops/action-gh-release@v2
        with:
          files: target/debian/*.deb
          generate_release_notes: true
