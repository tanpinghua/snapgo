[package]
name = "snapgo"
version = "0.1.0"
edition = "2024"
description = "A fast screenshot and annotation tool for GNOME on Wayland"
license = "MIT"
authors = ["tanpinghua <tanpinghua@gmail.com>"]
readme = "README.md"
repository = "https://github.com/tanpinghua/snapgo"

[dependencies]
cairo-rs = { version = "0.21", features = ["png"] }
gdk4-x11 = "0.10"
gtk4 = { version = "0.10", features = ["v4_14"] }
pangocairo = "0.21"
x11rb = "0.13"

# Debian package: `cargo deb` (see README, "Packaging").
[package.metadata.deb]
maintainer = "tanpinghua <tanpinghua@gmail.com>"
copyright = "2026, tanpinghua"
license-file = ["LICENSE", "0"]
extended-description = """\
Press a hotkey, drag a region of the frozen screen, annotate it in place \
(arrows, shapes, text, numbered markers, pixelate) and copy, save or pin \
the result. Built for GNOME on Wayland: captures through the desktop \
screenshot portal and keeps the clipboard alive after the overlay closes."""
section = "graphics"
priority = "optional"
depends = "$auto"
recommends = "xdg-desktop-portal-gnome, xwayland"
assets = [
    ["target/release/snapgo", "usr/bin/", "755"],
    ["data/org.snapgo.Snapgo.desktop", "usr/share/applications/", "644"],
    ["data/icons/48x48/org.snapgo.Snapgo.png", "usr/share/icons/hicolor/48x48/apps/", "644"],
    ["data/icons/64x64/org.snapgo.Snapgo.png", "usr/share/icons/hicolor/64x64/apps/", "644"],
    ["data/icons/128x128/org.snapgo.Snapgo.png", "usr/share/icons/hicolor/128x128/apps/", "644"],
    ["data/icons/256x256/org.snapgo.Snapgo.png", "usr/share/icons/hicolor/256x256/apps/", "644"],
    ["data/icons/512x512/org.snapgo.Snapgo.png", "usr/share/icons/hicolor/512x512/apps/", "644"],
    ["README.md", "usr/share/doc/snapgo/", "644"],
]

[profile.release]
opt-level = 3
lto = "thin"
strip = true
